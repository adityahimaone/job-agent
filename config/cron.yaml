# Cron-run overrides. Used by ~/apps/job-agent/run-cron.sh every 6 hours.
# The Mac ego(lite) lane is enabled for Dealls only: dealls.com blocks the VPS
# IP behind Cloudflare, so its discovery must browse from the Mac. If the Mac
# is offline that lane fails non-fatally and the other lanes still run.
ego:
  enabled: true
  host: "100.75.2.78"
  user: "adityahimawan"

platforms:
  linkedin:
    enabled: false
  wellfound:
    enabled: false
  indeed:
    enabled: true
    use_cdp: false
    use_camoufox: false
  glassdoor:
    enabled: false
  ziprecruiter:
    enabled: true
  dice:
    enabled: true
  dealls:
    enabled: true
    use_ego: true
    max_requests_per_minute: 3
    max_applications_per_day: 0
  linkedin_guest: {}

browser:
  headless: true

# Job-agent's own jobs/gigs/applications tabs are not wanted: results go into
# the 'hermes' research tab (scripts/push_hermes_tab.py) instead.
sheets:
  enabled: false