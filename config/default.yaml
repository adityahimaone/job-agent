# Job Agent Default Configuration
#
# Everything here can be overridden by a second YAML passed with `--config`,
# or by JOB_AGENT_<SECTION>__<KEY> environment variables.
# Human-editable Markdown templates live in config/templates/ (see docs/TEMPLATES.md).

agent:
  activity_start_hour: 8
  activity_end_hour: 23
  schedule_interval: 60
  # Safe by default. Set to false only when you are ready for real submissions.
  dry_run: true
  # Every submission needs an explicit approval (dashboard, sheet, or bot).
  require_approval_for_all: true
  max_run_minutes: 25
  cache_ai_responses: true
  ai_request_timeout: 60

matching:
  auto_apply_threshold: 0.90
  review_threshold: 0.50
  model: "cheap"
  max_ai_calls_per_run: 20          # deprecated, kept for compatibility
  max_match_calls_per_run: 40       # budget for scoring only
  max_generation_calls_per_run: 60  # budget for resumes / letters / emails
  max_cost_usd_per_run: 1.0

resume:
  master_resume: "config/templates/resume_master.md"
  cover_letter_tone: "professional"
  use_latex: false

# Grounded, human-editable document generation.
content:
  mode: "grounded"                 # grounded | legacy
  templates_dir: "config/templates"
  candidate_profile: "config/templates/candidate_profile.md"
  output_dir: ""                   # empty = ~/.job-agent/documents
  require_grounding: true
  prompt_version: "2026-11-06"

# Spreadsheet mirror + approval surface (see docs/SPREADSHEET.md).
sheets:
  enabled: true
  backend: "google"                # csv | google
  directory: "~/.job-agent/sheets"  # csv mirror (used when backend: csv)
  spreadsheet_id: "1qzDe71Wl7RviTVUYalDGOVmvHy4yAxrWtE_wty8Dx68"
  # Not a service account → falls back to the Hermes OAuth token below.
  credentials_path: "~/.hermes/google_client_secret.json"
  token_path: "~/.hermes/google_token.json"
  pull_decisions: true

# Fast discovery from structured feeds (see docs/COVERAGE.md).
feeds:
  enabled: true
  config_path: "config/feeds.yaml"
  max_workers: 6
  timeout: 12

# AI-training / expert-network gigs (see docs/COVERAGE.md).
gigs:
  enabled: true
  networks: ["alignerr"]
  min_hourly_rate: 20.0
  remote_only: true

# Discovery lanes: Muse is primary, Ego Lite on the Mac is the fallback.
# The Muse lane is driven by an external Muse cron run (docs/MUSE_CRON.md)
# that writes a jobs file for `job-agent muse run`. Ego only runs when the
# Muse import yields zero NEW jobs (see docs/MUSE_PRIMARY_EGO_FALLBACK.md).
discovery:
  primary: muse
  fallback: ego
  fallback_enabled: true
  fallback_on_zero_new: true
  muse_queries:
    - "Frontend Engineer React"
    - "Design Engineer"
    - "React Developer"
    - "Frontend Engineer Design Systems"
  muse_locations:
    - "Singapore"
    - "Remote"
    - "Jakarta, Indonesia"
    - "Kuala Lumpur, Malaysia"
    - "Bangkok, Thailand"
    - "Vietnam"
    - "Philippines"
  ego_queries:
    - "Frontend Engineer"
    - "Design Engineer"
    - "React Developer"
  ego_locations:
    - "Singapore"
    - "Remote"
  ego_platforms: [linkedin, dealls]
  ego_limit_per_query: 10

ego:
  # Drive the person's own ego(lite) browser instead of Playwright.
  # Running on the VPS: reach the Mac's ego(lite) over ssh (Tailscale).
  enabled: true
  host: "100.75.2.78"
  user: "adityahimawan"
  binary: ""                       # empty = auto-resolve Versions/Current
  timeout: 180
  task_space: "job-agent"
  settle_ms: 2500
  apply_enabled: true
  require_human_submit: true
  board_config_path: "config/discovery_sources.yaml"

platforms:
  dealls:
    enabled: true
    use_ego: true
    max_requests_per_minute: 3
    max_applications_per_day: 0   # discovery only; Dealls has no apply automation
    session_duration_minutes: 45
    cooldown_minutes: 30
  linkedin:
    enabled: true
    use_ego: true
    max_requests_per_minute: 3
    max_applications_per_day: 25
    max_connections_per_day: 20
    session_duration_minutes: 45
    cooldown_minutes: 30
  indeed:
    enabled: true
    max_requests_per_minute: 5
    max_applications_per_day: 40
    session_duration_minutes: 60
    cooldown_minutes: 20
    use_camoufox: false
    use_cdp: false
  glassdoor:
    enabled: false
    max_requests_per_minute: 4
    max_applications_per_day: 30
    session_duration_minutes: 60
    cooldown_minutes: 20
    use_camoufox: false
    use_cdp: true
  ziprecruiter:
    enabled: true
    max_requests_per_minute: 5
    max_applications_per_day: 40
    session_duration_minutes: 60
    cooldown_minutes: 20
  dice:
    enabled: true
    max_requests_per_minute: 4
    max_applications_per_day: 35
    session_duration_minutes: 60
    cooldown_minutes: 20
  wellfound:
    enabled: true
    use_ego: true
    max_requests_per_minute: 3
    max_applications_per_day: 20
    session_duration_minutes: 45
    cooldown_minutes: 25

browser:
  headless: true
  state_dir: "~/.job-agent/browser_state"
  proxy: null

notifications:
  email:
    enabled: false
    triggers: ["failed"]
  webhook:
    enabled: false
    triggers: ["auto_applied", "queued", "failed"]

dashboard:
  host: "127.0.0.1"
  port: 5000
  debug: false
  auth_enabled: true
  auth_token: ""                   # empty = auto-generate at ~/.job-agent/dashboard_token
  csrf_enabled: true
